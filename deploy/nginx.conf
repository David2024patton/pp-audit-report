server {
    listen 80;
    server_name _;

    root /app/src;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # data layer: sibling of src, fetched by JS at ../data -> /data/
    # no-cache is load-bearing: findings flip to fixed, board must reflect it
    location /data/ {
        alias /app/data/;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # static assets: sibling of src, referenced at ../assets -> /assets/
    location /assets/ {
        alias /app/assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # css/js: cache normally
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # /, /css/, /js/ served from /app/src
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
